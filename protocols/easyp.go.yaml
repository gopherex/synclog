lint:
  use:
    - DEFAULT
  enum_zero_value_suffix: _NONE
  service_suffix: Service
  ignore: []
  except: []
  allow_comment_ignores: false
deps:
  - github.com/bufbuild/protoc-gen-validate@v1.3.3
generate:
  inputs:
    - directory: synclog
  plugins:
    - name: go
      out: ../pkg/proto
      opts:
        paths: source_relative
    - name: go-grpc
      out: ../pkg/proto
      opts:
        paths: source_relative
