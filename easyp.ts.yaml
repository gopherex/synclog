lint:
  use:
    - DEFAULT
  enum_zero_value_suffix: _NONE
  service_suffix: Service
  ignore: []
  except: []
  allow_comment_ignores: false
  ignore_only: {}
generate:
  inputs:
    - directory: synclog
  plugins:
    - name: es
      out: ts/synclog/src/proto
      opts:
        target: ts
        import_extension: js
        json_types: true
breaking:
  ignore: []
  against_git_ref: master
